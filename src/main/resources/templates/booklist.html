<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head>
    <title>BookStore</title>
    <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
  </head>
  <body>
    <p>
      Logged in as: <span sec:authentication="name"></span>
    </p>
    <h1>Books</h1>

    <table class="table table-striped">
      <tr>
        <th>Author</th>
        <th>Title</th>
        <th>ISBN</th>
        <th>Year</th>
        <th sec:authorize="hasRole('ADMIN')">Action</th>
      </tr>

      <tr th:each="book : ${books}">
        <td th:text="${book.author}"></td>
        <td th:text="${book.title}"></td>
        <td th:text="${book.isbn}"></td>
        <td th:text="${book.publicationYear}"></td>
        <td sec:authorize="hasRole('ADMIN')">
            <a class="btn btn-danger" th:href="@{/delete/{id}(id=${book.id})}">Delete</a>
            <a class="btn btn-warning" th:href="@{/edit/{id}(id=${book.id})}">Edit</a>
        </td>
      </tr>
    </table>

    <br>
    <a class="btn btn-success" href="/addbook">Add Book</a>
    <form th:action="@{/logout}" method="post">
      <input type="submit" value="Logout"/>
    </form>
  </body>
</html>
